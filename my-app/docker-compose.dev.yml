services:
  app:
    image: bloglist-front-dev
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: bloglist-front-dev

  server:
    image: bloglist-backend-dev
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongo:27017/bloglist
      - SECRET=supersecretjwtkeyforbloglistapp
    container_name: bloglist-backend-dev
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: bloglist
    volumes:
      - ./mongo_data:/data/db

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: my-app-reverse-proxy
    depends_on:
      - app
      - server