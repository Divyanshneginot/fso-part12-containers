services:
  app:
    image: bloglist-front
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloglist-front

  server:
    image: bloglist-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongo:27017/bloglist
      - SECRET=supersecretjwtkeyforbloglistapp
    container_name: bloglist-backend
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: bloglist
    volumes:
      - ./mongo_data:/data/db

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: my-app-reverse-proxy
    depends_on:
      - app
      - server
